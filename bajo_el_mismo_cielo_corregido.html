<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060b"><title>BAJO EL MISMO CIELO</title>
<style>
:root{--gold:#d6ad62;--pale:#f5dfaa;--night:#05060b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--night);color:var(--pale);font-family:Georgia,'Times New Roman',serif}
.page{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#202039 0,#0b1020 48%,#030409 100%);display:flex;justify-content:center;padding:24px 14px 42px}
.page:before{content:"";position:absolute;inset:0;opacity:.42;background-image:radial-gradient(1px 1px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 78% 12%,#f5dca0 98%,transparent),radial-gradient(1px 1px at 22% 70%,#fff 98%,transparent),radial-gradient(1px 1px at 90% 82%,#fff 98%,transparent),radial-gradient(1px 1px at 56% 8%,#fff 98%,transparent);background-size:190px 170px,230px 210px,170px 190px,260px 230px,210px 180px}
.frame{position:relative;z-index:1;width:min(100%,760px);border:1px solid #bd914e;padding:26px 14px 30px;box-shadow:0 0 0 4px #bd914e20,inset 0 0 55px #d6ad6210;text-align:center}
.frame:before,.frame:after{content:"✦";position:absolute;color:var(--gold);font-size:18px;background:#080a12;padding:0 8px;left:50%;transform:translateX(-50%)}
.frame:before{top:-12px}.frame:after{bottom:-12px}
.eyebrow{font:10px Arial,sans-serif;letter-spacing:5px;color:#d9b875;text-transform:uppercase}
h1{font-size:clamp(30px,7vw,54px);font-weight:400;letter-spacing:3px;line-height:1.18;margin:14px 0 4px;color:#f2d28b;text-shadow:0 0 24px #d69d4c66}
.ornament{color:#d9b66f;letter-spacing:8px;font-size:18px;margin:5px 0 18px}
.chart{width:min(94vw,620px);margin:0 auto;aspect-ratio:1;position:relative;filter:drop-shadow(0 0 22px #d7a64c22)}
.chart svg{width:100%;height:100%;display:block}
.tagline{font-size:clamp(16px,3.8vw,21px);letter-spacing:1px;margin:8px 0 23px}
button{border:1px solid #e4c27b;background:linear-gradient(135deg,#9e7437,#f0d493 50%,#9b7138);color:#17120a;padding:15px 22px;border-radius:2px;font:600 11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
button:active{transform:scale(.98)}
.foot{font:10px Arial,sans-serif;letter-spacing:1.4px;color:#bca77c;margin:18px 0 0}
#ar{display:none;position:fixed;inset:0;z-index:5;background:#02030a}
#cam{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#arfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#close{position:absolute;z-index:7;top:calc(env(safe-area-inset-top) + 14px);right:14px;background:#0b0c12dd;color:#f5dfaa;border:1px solid #d6ad62}
#arname{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:10px;right:10px;text-align:center;font-size:clamp(22px,5vw,34px);letter-spacing:3px;color:#f4d28b;text-shadow:0 2px 12px #000,0 0 22px #e2b85b}
#arhint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 70px);left:12px;right:12px;text-align:center;font:10px Arial,sans-serif;letter-spacing:2px;color:#f4e5c4;text-shadow:0 2px 8px #000}
@media(min-width:650px){.frame{padding:34px 30px}.chart{width:min(78vw,620px)}}
</style>
</head>
<body>
<main class="page"><section class="frame">
<div class="eyebrow">Un mismo cielo · Tres lugares · Un vínculo</div>
<h1>BAJO EL<br>MISMO CIELO</h1>
<div class="ornament">────── ✦ ──────</div>
<div class="chart">
<svg viewBox="0 0 700 700" role="img" aria-label="Carta celeste artística con constelaciones y tres coordenadas conectadas">
<defs>
 <radialGradient id="space"><stop stop-color="#25213a"/><stop offset=".62" stop-color="#0b1021"/><stop offset="1" stop-color="#03050b"/></radialGradient>
 <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8d789c" stop-opacity="0"/><stop offset=".45" stop-color="#c3a6c2" stop-opacity=".3"/><stop offset=".56" stop-color="#f1d5ad" stop-opacity=".42"/><stop offset=".7" stop-color="#8f789f" stop-opacity=".2"/><stop offset="1" stop-color="#8d789c" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="disc"><circle cx="350" cy="350" r="292"/></clipPath>
</defs>
<circle cx="350" cy="350" r="322" fill="none" stroke="#d6ad62" stroke-width="1.5"/>
<circle cx="350" cy="350" r="311" fill="none" stroke="#a77d42" stroke-width=".7"/>
<g stroke="#d6ad62" opacity=".75"><path d="M350 18v22 M350 660v22 M18 350h22 M660 350h22" stroke-width="2"/><path d="M350 29l-8 14h16z M350 671l-8-14h16z M29 350l14-8v16z M671 350l-14-8v16z" fill="#d6ad62"/></g>
<g clip-path="url(#disc)">
<circle cx="350" cy="350" r="292" fill="url(#space)"/>
<path d="M80 510 Q190 360 300 280 T630 90 L680 210 Q500 330 390 420 T130 630Z" fill="url(#milky)" opacity=".95"/>
<g id="stars" fill="#fff2d0">
<circle cx="120" cy="160" r="1.8"/><circle cx="174" cy="105" r="1.3"/><circle cx="240" cy="150" r="1.5"/><circle cx="290" cy="85" r="1.2"/><circle cx="410" cy="120" r="1.8"/><circle cx="500" cy="140" r="1.2"/><circle cx="575" cy="205" r="1.7"/><circle cx="95" cy="290" r="1.3"/><circle cx="165" cy="245" r="1.8"/><circle cx="240" cy="220" r="1.2"/><circle cx="320" cy="180" r="1.5"/><circle cx="455" cy="235" r="1.4"/><circle cx="535" cy="300" r="1.6"/><circle cx="105" cy="410" r="1.6"/><circle cx="190" cy="360" r="1.2"/><circle cx="280" cy="310" r="1.7"/><circle cx="390" cy="290" r="1.4"/><circle cx="490" cy="390" r="1.8"/><circle cx="590" cy="450" r="1.3"/><circle cx="140" cy="520" r="1.5"/><circle cx="230" cy="570" r="1.2"/><circle cx="340" cy="500" r="1.7"/><circle cx="430" cy="550" r="1.3"/><circle cx="530" cy="570" r="1.6"/><circle cx="600" cy="350" r="1.1"/>
</g>
<g fill="none" stroke="#d9bd83" stroke-width="1.1" opacity=".75">
<!-- Cisne --> <path d="M160 160L225 205L285 150L330 210L225 205L205 275"/>
<!-- Lira --> <path d="M390 105L435 155L480 112L435 155L450 205"/>
<!-- Hércules --> <path d="M510 235L555 270L525 315L570 350L555 270L600 245"/>
<!-- Águila --> <path d="M300 300L350 260L405 305L350 350L300 300"/>
<!-- Pegaso --> <path d="M115 330L175 300L210 360L150 400L115 330"/>
<!-- Escorpión --> <path d="M465 430L510 455L545 500L585 485L560 535"/>
<!-- Sagitario --> <path d="M300 470L345 430L395 460L365 510L300 470"/>
<!-- Acuario --> <path d="M150 475L195 450L230 495L185 530"/>
<!-- Corona Austral --> <path d="M255 565L285 545L315 560L340 545L365 560"/>
</g>
<g fill="#f3dba8" font-family="Georgia,serif" font-size="13" opacity=".9">
<text x="145" y="143">Cisne</text><text x="410" y="91">Lira</text><text x="525" y="225">Hércules</text><text x="310" y="245">Águila</text><text x="92" y="318">Pegaso</text><text x="492" y="420">Escorpión</text><text x="320" y="530">Sagitario</text><text x="120" y="465">Acuario</text><text x="265" y="590">Corona Austral</text>
</g>
<!-- Tres ubicaciones conectadas; coordenadas exactas del diseño de referencia -->
<g fill="none" stroke="#e2b75d" stroke-width="2.2" stroke-dasharray="5 9" opacity=".95">
<path d="M350 160 Q235 315 190 430"/><path d="M350 160 Q485 300 515 420"/><path d="M190 430 Q350 500 515 420"/>
</g>
<g filter="url(#glow)"><circle cx="350" cy="160" r="7" fill="#fff0b3"/><circle cx="190" cy="430" r="7" fill="#fff0b3"/><circle cx="515" cy="420" r="7" fill="#fff0b3"/></g>
<g fill="none" stroke="#e9c66e"><circle cx="350" cy="160" r="17"/><circle cx="190" cy="430" r="17"/><circle cx="515" cy="420" r="17"/></g>
<g font-family="Georgia,serif" font-size="15" fill="#f8df9e" text-anchor="middle">
<rect x="265" y="112" width="170" height="29" rx="14" fill="#090b13" stroke="#d6ad62"/><text x="350" y="132">0.81° N, 77.72° O</text>
<rect x="91" y="455" width="180" height="29" rx="14" fill="#090b13" stroke="#d6ad62"/><text x="181" y="475">2.90° S, 79.00° O</text>
<rect x="426" y="454" width="180" height="29" rx="14" fill="#090b13" stroke="#d6ad62"/><text x="516" y="474">2.19° S, 79.89° O</text>
</g>
</g>
<g fill="#d6ad62" font-family="Georgia,serif" font-size="19" text-anchor="middle"><text x="350" y="47">N</text><text x="350" y="674">S</text><text x="42" y="357">E</text><text x="658" y="357">O</text></g>
<circle cx="350" cy="350" r="292" fill="none" stroke="#d6ad62" stroke-width="1.4"/>
<circle cx="350" cy="350" r="280" fill="none" stroke="#a77d42" stroke-width=".6" stroke-dasharray="2 8"/>
</svg>
</div>
<div class="tagline">Escanea el código QR y descubre un cielo solo nuestro.</div>
<button id="launch">Descubrir este cielo</button>
<div class="foot">TRES COORDENADAS · UNA MISMA CONSTELACIÓN</div>
</section></main>
<section id="ar"><video id="cam" autoplay playsinline muted></video><canvas id="arfx"></canvas><button id="close">Cerrar ✕</button><div id="arhint">EL CIELO NOS CONECTA</div><div id="arname">BAJO EL MISMO CIELO ✦</div></section>
<script>
let stream=null;const launch=document.getElementById('launch'),ar=document.getElementById('ar'),cam=document.getElementById('cam'),fx=document.getElementById('arfx');
function drawAR(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;fx.width=w*d;fx.height=h*d;const c=fx.getContext('2d');c.scale(d,d);const pts=[[w*.5,h*.24],[w*.22,h*.57],[w*.78,h*.56]];c.strokeStyle='#e6bd68';c.lineWidth=1.5;c.setLineDash([4,8]);c.shadowColor='#f3d58c';c.shadowBlur=12;c.beginPath();c.moveTo(...pts[0]);c.lineTo(...pts[1]);c.lineTo(...pts[2]);c.closePath();c.stroke();c.setLineDash([]);pts.forEach(([x,y])=>{c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fillStyle='#fff0bd';c.fill();c.beginPath();c.arc(x,y,17,0,Math.PI*2);c.strokeStyle='#e6bd68';c.stroke()});c.shadowBlur=0;c.textAlign='center';c.fillStyle='#f8e3b2';c.font='12px Georgia';c.fillText('0.81° N, 77.72° O',pts[0][0],pts[0][1]-24);c.fillText('2.90° S, 79.00° O',pts[1][0],pts[1][1]+32);c.fillText('2.19° S, 79.89° O',pts[2][0],pts[2][1]+32)}
launch.addEventListener('click',async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});cam.srcObject=stream;ar.style.display='block';drawAR()}catch(e){alert('Para abrir la cámara, permite el acceso en tu navegador y vuelve a intentarlo.')}});
document.getElementById('close').addEventListener('click',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;ar.style.display='none'});
addEventListener('resize',()=>{if(ar.style.display==='block')drawAR()});
</script>
</body></html>
